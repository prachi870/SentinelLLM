services:
  # Web Service (FastAPI)
  - type: web
    name: sentinel-backend
    runtime: python
    repo: https://github.com/prachi870/SentinelLLM
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: sentinel-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: WATCHER_INTERVAL_SECONDS
        value: 300
      - key: MAX_LLM_CALLS_PER_SCAN
        value: 50

  # Celery Worker
  - type: worker
    name: sentinel-worker
    runtime: python
    repo: https://github.com/prachi870/SentinelLLM
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: python -m celery -A tasks.celery_app worker --queues=scans,default --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: sentinel-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: WATCHER_INTERVAL_SECONDS
        value: 300
      - key: MAX_LLM_CALLS_PER_SCAN
        value: 50

  # Celery Beat (Scheduler)
  - type: worker
    name: sentinel-beat
    runtime: python
    repo: https://github.com/prachi870/SentinelLLM
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: python -m celery -A tasks.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: sentinel-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: WATCHER_INTERVAL_SECONDS
        value: 300
      - key: MAX_LLM_CALLS_PER_SCAN
        value: 50

databases:
  - name: sentinel-db
    databaseName: sentinelloop
    user: sentinel
    plan: free
    region: oregon

  - name: sentinel-redis
    plan: free
    region: oregon
