services:
  # Web Service (FastAPI)
  - type: web
    name: sentinel-backend
    runtime: python
    repo: https://github.com/prachi870/SentinelLLM
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/
    envVarGroups:
      - name: sentinel-shared
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sentinel-redis
          type: keyvalue
          property: connectionString

  # Celery Worker
  - type: worker
    name: sentinel-worker
    runtime: python
    repo: https://github.com/prachi870/SentinelLLM
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m celery -A tasks.celery_app worker --queues=scans,default --loglevel=info
    envVarGroups:
      - name: sentinel-shared
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sentinel-redis
          type: keyvalue
          property: connectionString

  # Celery Beat (Scheduler)
  - type: worker
    name: sentinel-beat
    runtime: python
    repo: https://github.com/prachi870/SentinelLLM
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m celery -A tasks.celery_app beat --loglevel=info
    envVarGroups:
      - name: sentinel-shared
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sentinel-redis
          type: keyvalue
          property: connectionString

  # Redis-compatible broker and result backend for Celery.
  - type: keyvalue
    name: sentinel-redis
    region: oregon
    plan: free
    ipAllowList: []

databases:
  - name: sentinel-db
    databaseName: sentinelloop
    user: sentinel
    plan: free
    region: oregon

envVarGroups:
  - name: sentinel-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: WATCHER_INTERVAL_SECONDS
        value: 300
      - key: MAX_LLM_CALLS_PER_SCAN
        value: 50
      - key: SCAN_EXECUTION_MODE
        value: inline
      - key: SCAN_ATTACK_CONCURRENCY
        value: 1
